name: GitHub Classroom Workflow

on: [push]

jobs:
  build:
    name: Setup .NET 8.0
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'
      - uses: education/autograding@v1
        env:
          HOME: /tmp
          DOTNET_CLI_HOME: /tmp